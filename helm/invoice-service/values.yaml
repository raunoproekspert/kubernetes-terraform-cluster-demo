replicaCount: 1

image:
  repository: ghcr.io/raunoproekspert/micro-services-demo/invoice-service
  tag: "sha-0759510@sha256:4ac64c39c76acab8348b1a86a9336eff1df55561b3a5370eb344050fb719fcfd"
  pullPolicy: Always

imagePullSecret: ghcr-pull-secret

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: true
  host: invoice-service.local

resources:
  requests:
    cpu: "50m"
    memory: "256Mi"
  limits:
    cpu: "200m"
    memory: "512Mi"

livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /actuator/ready
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10
