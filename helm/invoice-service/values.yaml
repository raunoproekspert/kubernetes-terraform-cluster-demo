replicaCount: 1

image:
  repository: ghcr.io/raunoproekspert/invoice-service
  tag: "sha-0759510"
  pullPolicy: Always

imagePullSecret: ghcr-pull-secret

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: true
  host: invoice-service.local

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

livenessProbe:
  httpGet:
    path: /health
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /health
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10
