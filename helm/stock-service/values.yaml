replicaCount: 1

image:
  repository: ghcr.io/raunoproekspert/micro-services-demo/stock-service
  tag: "sha-6136908@sha256:e2d956199b5ccd532851c0574181bbac3aed2a992a37332b661dbd6f1942f4e5"
  pullPolicy: Always

imagePullSecret: ghcr-pull-secret

service:
  type: ClusterIP
  port: 8082

ingress:
  enabled: true
  host: stock-service.local

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

livenessProbe:
  httpGet:
    path: /health
    port: 8082
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /health
    port: 8082
  initialDelaySeconds: 5
  periodSeconds: 10
