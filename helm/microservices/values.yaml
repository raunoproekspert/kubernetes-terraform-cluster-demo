# Microservices umbrella chart values
#
# Structure: one top-level key per service, matching the dependency alias
# in Chart.yaml. Each service block is passed as sub-chart values.
#
# Example (uncomment and adapt when you add a real service):
#
# myService:
#   replicaCount: 1
#   image:
#     repository: ghcr.io/your-org/my-service
#     tag: "latest"
#     pullPolicy: IfNotPresent
#   service:
#     type: ClusterIP
#     port: 8080
#   ingress:
#     enabled: true
#     ingressClassName: traefik
#     hosts:
#       - host: my-service.local
#         paths:
#           - path: /
#             pathType: Prefix
#   resources:
#     requests:
#       cpu: "50m"
#       memory: "64Mi"
#     limits:
#       cpu: "200m"
#       memory: "256Mi"
