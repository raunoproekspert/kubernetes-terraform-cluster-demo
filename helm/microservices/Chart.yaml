apiVersion: v2
name: microservices
description: >
  Umbrella Helm chart for all application microservices.
  Add each service as a dependency below and provide its values
  in values.yaml.
type: application
version: 0.1.0
appVersion: "0.1.0"

# Add your microservice charts as dependencies, for example:
#
# dependencies:
#   - name: my-service
#     version: "1.0.0"
#     repository: "https://your-helm-repo"
#     alias: myService
#
# After adding dependencies, run: helm dependency update helm/microservices
