apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Ensures the root app is never pruned by a parent
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default

  source:
    repoURL: ${repo_url}
    targetRevision: ${repo_revision}
    path: argocd/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
